# SPDX-License-Identifier: MPL-2.0
# Dependabot configuration for RSR-compliant repositories
# Covers common ecosystems - remove unused ones for your project

version: 2
updates:
  # GitHub Actions - always include
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2

  # Julia packages (Project.toml compat bounds); routine bumps suppressed,
  # Dependabot security PRs still flow with open-pull-requests-limit: 0.
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  # NOTE: Nix is banned estate-wide — Guix is the sole package manager.
  # Do not add a `nix` ecosystem here. Guix has no Dependabot ecosystem;
  # pin Guix channels/manifests via build/ tooling instead.
