# SPDX-License-Identifier: MPL-2.0
name: "🔴 GATE: CodeQL"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    uses: hyperpolymath/standards/.github/workflows/codeql-reusable.yml@e2e0f6d61c2d2a36ef516849dc1ca9223563479f # main 2026-10-02
    secrets: inherit
    with:
      # CodeQL has no Julia extractor; the default (javascript-typescript)
      # finds no source here and fails finalising an empty database.
      # Analyse the workflows instead.
      language: actions
