# SPDX-License-Identifier: MPL-2.0
name: "🔴 GATE: Hypatia Security Scan"

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    uses: hyperpolymath/standards/.github/workflows/hypatia-scan-reusable.yml@e2e0f6d61c2d2a36ef516849dc1ca9223563479f # main 2026-10-02
    secrets: inherit
