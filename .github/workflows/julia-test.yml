# Julia test gate (required check) — flagship-rubric dimensions 1-3
# (Correctness & tests, Aqua, JET). See docs/flagship-rubric.adoc.
#
# Per the estate required-check rule: no `on.*.paths` filter on a required
# gate — a path-filtered required workflow that never triggers is reported
# as permanently "Expected" and blocks merges. This workflow always runs.

name: "⚙ AUTO: Julia Test Gate"

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JULIA_NUM_THREADS: 2

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.10 is the LTS floor declared in Project.toml's `[compat] julia`;
        # '1' resolves to the current stable release.
        julia-version: ['1.10', '1']

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v3.3.0

      - name: Instantiate / Build / Precompile / Test
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.build(); Pkg.precompile(); Pkg.test()'

  test-nightly:
    # Allowed to fail: nightly tracks unreleased Julia, where upstream packages
    # (currently JuliaInterpreter, needed by JET) may not yet precompile. The
    # red stays visible; it does not gate. Release lines are gated by `test`.
    name: Julia nightly (allowed to fail) - ubuntu-latest
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: nightly

      - uses: julia-actions/cache@v3.3.0

      - name: Instantiate / Build / Precompile / Test
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.build(); Pkg.precompile(); Pkg.test()'

  agda-proofs:
    # Typechecks proofs/agda (journal state-machine safety) with the Debian
    # trixie toolchain: Agda 2.6.4.3 + agda-stdlib 2.1, --safe --without-K.
    # The Julia `test` job separately fails if Transitions.agda is stale.
    name: Agda proofs (2.6.4.3, stdlib 2.1)
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Agda and agda-stdlib
        run: |
          apt-get update
          apt-get install -y --no-install-recommends agda agda-stdlib

      - name: Typecheck
        run: AGDA=/usr/bin/agda proofs/agda/check.sh
