# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
#
# Builds the Documenter site (docs/make.jl) and deploys it to GitHub Pages
# via the Pages artifact flow. This is the ONLY Pages producer: Documenter's
# `deploydocs` (which pushed an orphan `gh-pages` branch nothing served) is
# not used. Julia comes from a digest-pinned container rather than
# setup-julia so this workflow's `uses:` set — and its actions.lock entry —
# stays {checkout, upload-pages-artifact, deploy-pages}.
name: GitHub Pages (Documenter)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # julia:1.10 (multi-arch index digest, resolved 2026-10-02)
      image: julia:1.10@sha256:238c8f5760477abfc0c8fd2828bbcbfa2a7f5510d11a26f1884a2fbfdb28b365
    steps:
      # The julia image ships no git. Without it actions/checkout falls back
      # to a tarball (no .git), and makedocs then refuses `repo =` outside a
      # Git repository. Install it before checking out.
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - name: Checkout Site
        uses: actions/checkout@v7.0.1
      - name: Build documentation (Documenter, doctest=true)
        run: julia --project=docs docs/make.jl
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: 'docs/build'
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
