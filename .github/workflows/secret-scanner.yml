  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@e2e0f6d61c2d2a36ef516849dc1ca9223563479f # main 2026-10-02
    secrets: inherit
