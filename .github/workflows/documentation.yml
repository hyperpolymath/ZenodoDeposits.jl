# Documenter build + doctest check. Publishing is done by pages.yml (Pages
# artifact flow); this workflow never pushes, so it needs read-only contents.
# Flagship-rubric dimension 5 (Documentation). See docs/flagship-rubric.adoc.
#
# Per the estate required-check rule: no `on.*.paths` filter — this
# workflow always runs so it is never stuck "Expected" on unrelated PRs.

name: "🟡 CHECK: Documentation"

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs (Documenter, with doctests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: '1.10'

      - uses: julia-actions/cache@v3.4.0

      - name: Build documentation (doctest=true)
        run: julia --project=docs docs/make.jl
